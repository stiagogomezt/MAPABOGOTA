<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bogotá 3D - Gemelo digital del terreno</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#0b0f1a;color:#e6e6e6;overflow:hidden}
#canvas{position:fixed;inset:0}
#ui{position:fixed;top:12px;left:12px;background:rgba(0,0,0,.55);padding:12px;border-radius:8px;max-width:320px}
#ui h1{font-size:16px;margin:0 0 8px}
#ui button,#ui select{margin:4px 0;width:100%;padding:6px}
#status{font-size:12px;opacity:.8;margin-top:6px}
#credits{position:fixed;bottom:8px;right:8px;font-size:11px;opacity:.7;max-width:420px;text-align:right}
#loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0b0f1a;font-size:18px}
</style>
</head>
<body>
<a href="#main" class="skip-link">Saltar al contenido</a>
<div id="loader">Cargando terreno…</div>
<canvas id="canvas"></canvas>
<main id="main" tabindex="-1" style="position:fixed;inset:0;pointer-events:none"></main>
<div id="ui">
  <h1>Bogotá 3D</h1>
  <label for="tex" style="display:block;font-size:12px;margin-bottom:2px">Textura</label>
  <select id="tex">
    <option value="satellite">Satelital</option>
    <option value="localidades">Localidades</option>
    <option value="valor">Valor / estrato</option>
    <option value="relief">Relieve + hipsometría</option>
    <option value="slope">Pendientes</option>
  </select>
  <button id="fly">Sobrevolar Bogotá</button>
  <button id="buildings">Mostrar/ocultar edificaciones</button>
  <button id="profile">Perfil topográfico</button>
  <button id="videoBtn">Ver video de sobrevuelo</button>
  <div id="status"></div>
</div>
<div id="credits">MDT: UAECD (CC BY-NC-SA 4.0) · Copernicus DEM GLO-30 · Sentinel-2/ESA · Ortoimagen satelital. Productos derivados bajo CC BY-NC-SA 4.0.</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const canvas=document.getElementById('canvas');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x0b0f1a);

const camera=new THREE.PerspectiveCamera(55,window.innerWidth/window.innerHeight,1,200000);
camera.position.set(0,0,50000);
camera.lookAt(0,0,0);
const light=new THREE.DirectionalLight(0xffffff,2.0);
light.position.set(10000,-10000,5000); scene.add(light);
scene.add(new THREE.AmbientLight(0xffffff,1.0));

const texLoader=new THREE.TextureLoader();
const textures={
 satellite: texLoader.load('terrain/texture_satellite_4096.jpg'),
 localidades: texLoader.load('terrain/texture_localidades_4096.jpg'),
 valor: texLoader.load('terrain/texture_valor_4096.jpg'),
 relief: texLoader.load('terrain/texture_relief_4096.jpg'),
 slope: texLoader.load('terrain/texture_slope_4096.jpg'),
};
// fix paths: textures are in data/processed/terrain not web; place copies in web/terrain
// We'll load from web/terrain if exists, fallback to data path via relative
Object.keys(textures).forEach(k=>{textures[k].colorSpace=THREE.SRGBColorSpace;});

let terrain=null;
const loader=new GLTFLoader();
loader.load('terrain/terrain.glb', (gltf)=>{
  terrain=gltf.scene;
  let mesh=null;
  terrain.traverse(o=>{ if(o.isMesh && !mesh) mesh=o; });
  const box=new THREE.Box3().setFromObject(terrain);
  if(mesh){
    const mat=new THREE.MeshStandardMaterial({map:textures.satellite, side:THREE.DoubleSide});
    mesh.material=mat;

  }
  const mat=new THREE.MeshStandardMaterial({map:textures.satellite});
  mesh.material=mat;
  scene.add(terrain);
  document.getElementById('loader').style.display='none';
}, undefined, (e)=>{console.error('GLB load error:',e);document.getElementById('status').textContent='Error cargando terreno: '+(e&&e.message?e.message:e)+' (terrain/terrain.glb)';});

// texture selector
document.getElementById('tex').addEventListener('change', (e)=>{
  if(!terrain) return;
  terrain.children[0].material.map=textures[e.target.value];
  terrain.children[0].material.needsUpdate=true;
});

// flyover
let flying=false, flyIndex=0, flyData=null;
fetch('terrain/camera_path.json').then(r=>r.json()).then(d=>{flyData=d;});
document.getElementById('fly').addEventListener('click',()=>{
  if(!flyData) return;
  flying=!flying; flyIndex=0;
});
document.getElementById('buildings').addEventListener('click',()=>{ /* placeholder */ });
document.getElementById('videoBtn').addEventListener('click',()=>{ window.open('media/bogota_flyover.mp4','_blank'); });

// animation loop
const clock=new THREE.Clock();
let renderCount=0;
function animate(){
  requestAnimationFrame(animate);
  renderer.render(scene,camera);
  renderCount++;
  if(flying && flyData){
    const step=Math.floor(clock.getElapsedTime()*30)%flyData.length;
    const p=flyData[step].position;
    camera.position.set(p[0],p[1],p[2]);
  }
  renderer.render(scene,camera);
}
animate();
window.addEventListener('resize',()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});
</script>
</body>
</html>
